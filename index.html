<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>SAKETH · GYM TRACKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #080808;
    --s1:       #101010;
    --s2:       #161616;
    --s3:       #1e1e1e;
    --border:   #252525;
    --border2:  #2e2e2e;
    --text:     #f0f0f0;
    --muted:    #606060;
    --dim:      #888;
    --font-d:   'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
    --font-b:   'Barlow', Arial, sans-serif;
  }
  html { background: var(--bg); color: var(--text); font-family: var(--font-d); }
  body { min-height: 100dvh; overflow-x: hidden; }
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
  button { font-family: var(--font-d); cursor: pointer; }
  input, textarea { font-family: var(--font-b); }

  /* ── Layout ── */
  #app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100dvh; }

  /* ── Header ── */
  #header {
    position: sticky; top: 0; z-index: 60;
    background: #0a0a0aee; backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 10px;
  }
  #header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  #logo { font-size: 24px; font-weight: 900; letter-spacing: .07em; line-height: 1; }
  #week-label { font-size: 10px; color: var(--muted); letter-spacing: .14em; margin-top: 3px; font-family: var(--font-b); }
  #header-btns { display: flex; gap: 8px; align-items: center; }
  .hbtn {
    background: transparent; border: 1px solid var(--border2);
    border-radius: 6px; color: var(--dim); font-size: 10px; font-weight: 700;
    padding: 5px 10px; letter-spacing: .06em; transition: all .15s;
  }
  .hbtn:hover { border-color: var(--dim); color: var(--text); }
  .hbtn-primary {
    border: none; border-radius: 6px; color: #fff;
    font-size: 10px; font-weight: 700; padding: 5px 12px; letter-spacing: .06em;
  }

  /* ── Week progress ── */
  #week-prog { margin-top: 10px; }
  #week-prog-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); margin-bottom: 4px; letter-spacing: .07em; font-family: var(--font-b); }
  #week-prog-bar { height: 2px; background: #1e1e1e; border-radius: 2px; overflow: hidden; }
  #week-prog-fill { height: 100%; border-radius: 2px; transition: width .5s ease; }

  /* ── Coach panel ── */
  #coach-panel {
    margin: 10px 14px 0;
    background: #0a150a; border: 1px solid #1e3a1e;
    border-left: 3px solid #10B981;
    border-radius: 8px; padding: 12px 14px;
    animation: fadeIn .2s ease;
  }
  #coach-tag { font-size: 9px; font-weight: 700; color: #10B981; letter-spacing: .16em; margin-bottom: 6px; }
  #coach-goal { font-size: 11px; color: #10B981; font-weight: 700; margin-bottom: 5px; font-family: var(--font-b); }
  #coach-text { font-size: 12px; color: #888; line-height: 1.65; font-family: var(--font-b); }

  /* ── Day tabs ── */
  #day-tabs {
    display: flex; overflow-x: auto; background: #0a0a0a;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    scrollbar-width: none; margin-top: 10px;
  }
  #day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex: 0 0 auto; padding: 10px 13px 8px;
    cursor: pointer; position: relative; text-align: center; min-width: 60px;
    -webkit-tap-highlight-color: transparent;
  }
  .day-tab-lbl { font-size: 9px; font-weight: 700; letter-spacing: .1em; margin-bottom: 3px; font-family: var(--font-b); transition: color .15s; }
  .day-tab-name { font-size: 12px; font-weight: 800; letter-spacing: .04em; transition: color .15s; }
  .day-tab-prog { font-size: 9px; font-weight: 700; margin-top: 2px; transition: color .15s; }
  .day-tab-line { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 65%; height: 2px; border-radius: 2px 2px 0 0; }

  /* ── Day content ── */
  #day-content { padding: 13px 13px 120px; flex: 1; }

  /* ── Day hero ── */
  .day-hero { border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .hero-title { font-size: 28px; font-weight: 900; letter-spacing: .05em; line-height: 1; }
  .hero-focus { font-size: 12px; color: var(--dim); margin-top: 4px; font-family: var(--font-b); }
  .hero-reset {
    background: transparent; border: 1px solid var(--border2);
    border-radius: 5px; color: var(--muted); font-size: 9px; font-weight: 700;
    padding: 4px 8px; letter-spacing: .06em; transition: all .15s;
  }
  .hero-reset:hover { border-color: #E84040; color: #E84040; }
  .hero-prog { height: 3px; background: #1e1e1e; border-radius: 2px; overflow: hidden; margin-top: 12px; }
  .hero-prog-fill { height: 100%; border-radius: 2px; transition: width .4s ease; }
  .hero-warmup { margin-top: 10px; font-size: 11px; color: var(--muted); font-family: var(--font-b); border-left: 2px solid; padding-left: 8px; font-style: italic; }
  .hero-warmup strong { font-style: normal; font-weight: 700; }

  /* ── Section label ── */
  .section-lbl {
    font-size: 9px; font-weight: 700; letter-spacing: .2em;
    display: flex; align-items: center; gap: 8px;
    margin: 14px 0 8px;
  }
  .section-lbl-line { height: 1px; width: 14px; flex-shrink: 0; }

  /* ── Exercise card ── */
  .ex-card {
    background: var(--s1); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-bottom: 7px;
    transition: border-color .2s;
  }
  .ex-card.done { border-color: var(--done-color, #333); }
  .ex-header {
    display: flex; align-items: center; padding: 11px 13px;
    cursor: pointer; gap: 10px; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .ex-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; transition: background .2s; }
  .ex-name { font-size: 14px; font-weight: 700; letter-spacing: .01em; transition: color .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .ex-presc { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--font-b); font-style: italic; }
  .ex-meta { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .ex-count { font-size: 10px; font-weight: 700; }
  .ex-chevron { font-size: 11px; color: var(--muted); transition: transform .2s; display: inline-block; }
  .ex-chevron.open { transform: rotate(180deg); }

  /* ── Set rows ── */
  .ex-body { border-top: 1px solid var(--border); }
  .set-row { display: flex; align-items: center; gap: 7px; padding: 7px 12px; transition: background .2s; }
  .set-row.set-done { background: var(--set-done-bg, #0e1a0e); }
  .set-check {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid #333; background: transparent; color: #fff;
    font-size: 13px; display: flex; align-items: center; justify-content: center;
    transition: all .15s; cursor: pointer;
  }
  .set-lbl { font-size: 10px; color: var(--muted); font-weight: 700; letter-spacing: .08em; width: 34px; flex-shrink: 0; font-family: var(--font-b); }
  .set-input {
    width: 52px; background: #1a1a1a; border: 1px solid #2a2a2a;
    border-radius: 5px; color: var(--text); font-size: 13px; font-weight: 600;
    padding: 5px 6px; text-align: center; transition: border-color .15s; outline: none;
  }
  .set-input:focus { border-color: #444; }
  .set-unit { font-size: 10px; color: var(--muted); flex-shrink: 0; font-family: var(--font-b); }

  /* ── Note input ── */
  .ex-note-wrap { padding: 5px 12px 8px; }
  .ex-note {
    width: 100%; background: #0d0d0d; border: 1px solid #222; border-radius: 5px;
    color: var(--dim); font-size: 11px; padding: 6px 9px; font-style: italic;
    resize: none; outline: none; font-family: var(--font-b); line-height: 1.4;
    transition: border-color .15s;
  }
  .ex-note:focus { border-color: #333; }

  /* ── Bottom nav ── */
  #bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 520px;
    background: #0a0a0aee; backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 8px 6px 18px; display: flex; justify-content: space-around; z-index: 50;
  }
  .nav-btn {
    background: transparent; border: 1px solid transparent;
    border-radius: 8px; font-size: 9px; font-weight: 700;
    padding: 6px 10px; letter-spacing: .06em; text-align: center;
    transition: all .15s; line-height: 1.2;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn-icon { font-size: 13px; display: block; margin-bottom: 2px; }

  /* ── Export modal ── */
  #modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.88);
    z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn .15s ease;
  }
  #modal-box {
    background: #0f0f0f; border: 1px solid var(--border2);
    border-radius: 14px 14px 0 0; padding: 20px 16px 36px;
    width: 100%; max-width: 520px; animation: slideUp .22s ease;
  }
  #modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  #modal-title { font-size: 20px; font-weight: 900; letter-spacing: .05em; }
  #modal-sub { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--font-b); }
  #modal-close {
    background: #1a1a1a; border: none; border-radius: 50%;
    width: 30px; height: 30px; color: var(--dim); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  #csv-preview {
    background: #050505; border: 1px solid var(--border); border-radius: 7px;
    padding: 10px 12px; max-height: 170px; overflow-y: auto;
    font-family: monospace; font-size: 9.5px; color: #555; white-space: pre;
    line-height: 1.7; margin-bottom: 12px;
  }
  #export-hint {
    background: #0a140a; border: 1px solid #1e3a1e; border-radius: 7px;
    padding: 10px 12px; margin-bottom: 14px;
    font-size: 11px; color: #6fcf97; line-height: 1.7; font-family: var(--font-b);
  }
  #export-btns { display: flex; gap: 10px; }
  .exp-btn {
    flex: 1; border-radius: 8px; font-size: 13px; font-weight: 700;
    padding: 13px 0; letter-spacing: .05em; border: none; transition: all .2s;
  }
  .exp-btn-sec { background: #1e1e1e; color: var(--text); }
  .exp-btn-sec.copied { background: #10B981; color: #fff; }

  /* ── Animations ── */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .anim-day { animation: fadeIn .22s ease; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-top">
      <div>
        <div id="logo">SAKETH</div>
        <div id="week-label">LOADING...</div>
      </div>
      <div id="header-btns">

      </div>
    </div>
    <div id="week-prog">
      <div id="week-prog-labels">
        <span>WEEK PROGRESS</span>

      </div>
      <div id="week-prog-bar"><div id="week-prog-fill"></div></div>
    </div>
  </div>

  <div id="coach-panel" style="display:none"></div>
  <div id="day-tabs"></div>
  <div id="day-content"></div>
  <div id="bottom-nav"></div>
</div>

<!-- Export Modal -->
<div id="modal-backdrop" style="display:none" onclick="handleBackdropClick(event)">
  <div id="modal-box">
    <div id="modal-top">
      <div>
        <div id="modal-title">EXPORT DATA</div>
        <div id="modal-sub"></div>
      </div>
      <button id="modal-close" onclick="closeExport()">×</button>
    </div>
    <div id="csv-preview"></div>
    <div id="export-hint">
      <strong>Import into Excel:</strong><br>
      Download CSV → Excel → Data → From Text/CSV → Select file<br>
      OR: Copy CSV → Paste in blank sheet → Data → Text to Columns → Comma
    </div>
    <div id="export-btns">
      <button class="exp-btn exp-btn-sec" id="copy-btn" onclick="copyCSV()">COPY CSV</button>
      <button class="exp-btn hbtn-primary" id="dl-btn" onclick="downloadCSV()">DOWNLOAD .CSV</button>
    </div>
  </div>
</div>

        {id:"s9", name:"Jump Rope",                presc:"3 × 2 mins", sets:3, nw:1},
        {id:"s10",name:"Plank",                    presc:"3 × max hold", sets:3, nw:1},
      ]},
    ]
  },
  {
    id:"sun", label:"SUN", name:"REST", color:"#6B7280", focus:"Active Recovery — No Iron Today",
    warmup:null,
    sections:[
      { name:"ACTIVE RECOVERY", ex:[
        {id:"r1", name:"Swimming",              presc:"30–45 mins — freestyle or breaststroke", sets:1, nw:1},
        {id:"r2", name:"OR: Brisk Walk",        presc:"30 mins on top of 12k steps", sets:1, nw:1},
        {id:"r3", name:"Mobility / Foam Roll",  presc:"15–20 mins — hips, hamstrings, thoracic", sets:1, nw:1},
      ]},
      { name:"NUTRITION TARGETS", ex:[
        {id:"r4", name:"Protein Target", presc:"180–200 g protein — don't skip meals", sets:1, nw:1},
        {id:"r5", name:"Hydration",      presc:"3.5–4 L water + electrolytes", sets:1, nw:1},
      ]},
    ]
  },
];
// ═══════════════════════════════════════════════════════
// ── END WEEKLY UPDATE ZONE ──
// ═══════════════════════════════════════════════════════

// ── Storage ──────────────────────────────────────────────────
const SK = `saketh_gym_w${WEEK_META.week}`;

function loadState() {
  try {
    const raw = localStorage.getItem(SK);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return buildFreshState();
}

function buildFreshState() {
  const s = { openCards: {}, coachOpen: false };
  DAYS.forEach(day => {
    day.sections.forEach(sec => {
      sec.ex.forEach(ex => {
        s[ex.id] = {
          done: false,
          sets: Array.from({length: ex.sets}, () => ({checked:false, weight:"", reps:""})),
          note: ""
        };
      });
    });
  });
  return s;
}

function save() {
  try { localStorage.setItem(SK, JSON.stringify(STATE)); } catch(e) {}
}

let STATE = loadState();
let activeDay = 0;

// ── Helpers ───────────────────────────────────────────────────
function allEx() {
  return DAYS.flatMap(d => d.sections.flatMap(s => s.ex));
}

function dayExList(day) {
  return day.sections.flatMap(s => s.ex);
}

function dayDoneCount(day) {
  return dayExList(day).filter(ex => STATE[ex.id]?.done).length;
}

function weekStats() {
  const total = allEx().length;
  const done  = allEx().filter(ex => STATE[ex.id]?.done).length;
  return {total, done, pct: total ? Math.round(done/total*100) : 0};
}

function hexTint(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const t = 0.88;
  return `rgb(${Math.round(r+(255-r)*t)},${Math.round(g+(255-g)*t)},${Math.round(b+(255-b)*t)})`;
}

// ── Render helpers ────────────────────────────────────────────
function el(tag, attrs={}, ...children) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  children.flat().forEach(c => {
    if (c == null || c === false) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

// ── Render week header ────────────────────────────────────────
function renderHeader() {
  const day = DAYS[activeDay];
  document.getElementById('week-label').textContent = `WEEK ${WEEK_META.week} · ${WEEK_META.label}`;
  const exportBtn = document.getElementById('export-open-btn');
  exportBtn.style.background = day.color;

  const {total, done, pct} = weekStats();
  const progText = document.getElementById('week-prog-text');
  progText.textContent = `${done} / ${total} exercises · ${pct}%`;
  progText.style.color = day.color;
  const fill = document.getElementById('week-prog-fill');
  fill.style.width = pct + '%';
  fill.style.background = `linear-gradient(90deg, ${day.color}, ${day.color}88)`;
}

// ── Render coach panel ────────────────────────────────────────
function toggleCoach() {
  STATE.coachOpen = !STATE.coachOpen;
  save();
  renderCoachPanel();
}

function renderCoachPanel() {
  const panel = document.getElementById('coach-panel');
  if (!STATE.coachOpen) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  panel.innerHTML = `
    <div id="coach-tag">COACH NOTE · WEEK ${WEEK_META.week}</div>
    <div id="coach-goal">${WEEK_META.goal}</div>
    <div id="coach-text">${WEEK_META.coachNote}</div>
  `;
}

// ── Render day tabs ───────────────────────────────────────────
function renderTabs() {
  const tabs = document.getElementById('day-tabs');
  tabs.innerHTML = '';
  DAYS.forEach((day, i) => {
    const done = dayDoneCount(day);
    const total = dayExList(day).length;
    const isActive = i === activeDay;
    const tab = el('div', {
      class: 'day-tab',
      onclick: () => { activeDay = i; renderAll(); }
    },
      el('div', {class:'day-tab-lbl', style:{color: isActive ? day.color : '#3a3a3a'}}, day.label),
      el('div', {class:'day-tab-name', style:{color: isActive ? '#f0f0f0' : '#444'}}, day.name),
      el('div', {class:'day-tab-prog', style:{color: done===total ? day.color : '#3a3a3a'}}, `${done}/${total}`)
    );
    if (isActive) {
      const line = el('div', {class:'day-tab-line', style:{background: day.color}});
      tab.appendChild(line);
    }
    tabs.appendChild(tab);
  });
}

// ── Render day content ────────────────────────────────────────
function renderDay() {
  const content = document.getElementById('day-content');
  content.className = 'anim-day';
  void content.offsetWidth;
  const day = DAYS[activeDay];
  const exList = dayExList(day);
  const done = exList.filter(ex => STATE[ex.id]?.done).length;
  const total = exList.length;
  const pct = total ? (done/total)*100 : 0;

  content.innerHTML = '';

  // Hero
  const hero = el('div', {class:'day-hero', style:{
    background: `linear-gradient(135deg, ${day.color}18 0%, transparent 65%)`,
    border: `1px solid ${day.color}30`
  }});

  const heroTop = el('div', {class:'hero-top'});
  const heroLeft = el('div', {},
    el('div', {class:'hero-title', style:{color: day.color}}, `${day.label} — ${day.name}`),
    el('div', {class:'hero-focus'}, day.focus)
  );
  const resetBtn = el('button', {
    class:'hero-reset',
    onclick: () => {
      if (!confirm(`Reset all sets for ${day.name}?`)) return;
      exList.forEach(ex => {
        STATE[ex.id] = {
          done: false,
          sets: Array.from({length: ex.sets}, () => ({checked:false, weight:'', reps:''})),
          note: ''
        };
      });
      save(); renderAll();
    }
  }, 'RESET');
  heroTop.append(heroLeft, resetBtn);

  const progBar = el('div', {class:'hero-prog'});
  const progFill = el('div', {class:'hero-prog-fill', style:{width: pct+'%', background: day.color}});
  progBar.appendChild(progFill);

  hero.append(heroTop, progBar);

  if (day.warmup) {
    const wu = el('div', {class:'hero-warmup', style:{borderColor: day.color, color: day.color + 'bb'}});
    wu.innerHTML = `<strong style="color:${day.color}">WARM-UP: </strong><span style="color:#888;font-family:var(--font-b)">${day.warmup}</span>`;
    hero.appendChild(wu);
  }
  content.appendChild(hero);

  // Sections + Exercises
  day.sections.forEach(sec => {
    // Section label
    const sl = el('div', {class:'section-lbl', style:{color: day.color}},
      el('div', {class:'section-lbl-line', style:{background: day.color}}),
      sec.name
    );
    content.appendChild(sl);

    sec.ex.forEach(ex => {
      content.appendChild(buildExCard(ex, day.color));
    });
  });
}

function buildExCard(ex, color) {
  const exState = STATE[ex.id] || {done:false, sets:[], note:''};
  const allDone = exState.sets.length > 0 && exState.sets.every(s => s.checked);
  const anyDone = exState.sets.some(s => s.checked);
  const isOpen  = STATE.openCards?.[ex.id] || false;

  const card = el('div', {class: 'ex-card' + (allDone ? ' done' : '')});
  card.style.setProperty('--done-color', color + '44');
  card.style.setProperty('--set-done-bg', color + '12');

  // Header
  const hdr = el('div', {class:'ex-header'});

  const dot = el('div', {class:'ex-dot', style:{
    background: allDone ? color : anyDone ? color+'55' : '#2a2a2a'
  }});

  const info = el('div', {style:{flex:'1', minWidth:'0'}},
    el('div', {class:'ex-name', style:{color: allDone ? color : '#f0f0f0'}}, ex.name),
    el('div', {class:'ex-presc'}, ex.presc)
  );

  const meta = el('div', {class:'ex-meta'},
    el('span', {class:'ex-count', style:{color: allDone ? color : '#555'}},
      `${exState.sets.filter(s=>s.checked).length}/${ex.sets}`),
    el('span', {class:'ex-chevron' + (isOpen ? ' open' : '')}, '▾')
  );

  hdr.append(dot, info, meta);
  hdr.addEventListener('click', () => {
    if (!STATE.openCards) STATE.openCards = {};
    STATE.openCards[ex.id] = !STATE.openCards[ex.id];
    save();
    // Re-render just this card in place
    const newCard = buildExCard(ex, color);
    card.replaceWith(newCard);
  });

  card.appendChild(hdr);

  if (isOpen) {
    const body = el('div', {class:'ex-body'});

    exState.sets.forEach((set, idx) => {
      const row = el('div', {class:'set-row' + (set.checked ? ' set-done' : '')});

      const checkBtn = el('button', {class:'set-check'}, set.checked ? '✓' : '');
      checkBtn.style.borderColor = set.checked ? color : '#333';
      checkBtn.style.background  = set.checked ? color : 'transparent';
      checkBtn.addEventListener('click', e => {
        e.stopPropagation();
        exState.sets[idx].checked = !exState.sets[idx].checked;
        exState.done = exState.sets.every(s => s.checked);
        save(); renderAll();
      });

      const lbl = el('div', {class:'set-lbl'}, `SET ${idx+1}`);

      row.append(checkBtn, lbl);

      if (!ex.nw) {
        const wInput = el('input', {type:'number', class:'set-input', placeholder:'kg', value: set.weight});
        wInput.addEventListener('input', e => {
          exState.sets[idx].weight = e.target.value; save();
        });
        const wLbl = el('span', {class:'set-unit'}, 'kg');
        row.append(wInput, wLbl);
      }

      const rInput = el('input', {type:'number', class:'set-input', placeholder:'reps', value: set.reps});
      rInput.style.marginLeft = ex.nw ? 'auto' : '0';
      rInput.addEventListener('input', e => {
        exState.sets[idx].reps = e.target.value; save();
      });
      const rLbl = el('span', {class:'set-unit'}, 'reps');
      row.append(rInput, rLbl);

      body.appendChild(row);
    });

    // Note
    const noteWrap = el('div', {class:'ex-note-wrap'});
    const note = el('textarea', {class:'ex-note', placeholder:'Notes — form cue, feel, PR...', rows:2});
    note.value = exState.note || '';
    note.addEventListener('input', e => { exState.note = e.target.value; save(); });
    noteWrap.appendChild(note);
    body.appendChild(noteWrap);
    card.appendChild(body);
  }

  return card;
}

// ── Render bottom nav ─────────────────────────────────────────
function renderBottomNav() {
  const nav = document.getElementById('bottom-nav');
  nav.innerHTML = '';
  DAYS.forEach((day, i) => {
    const done  = dayDoneCount(day);
    const total = dayExList(day).length;
    const complete = done === total;
    const isActive = i === activeDay;

    const btn = el('button', {
      class: 'nav-btn',
      onclick: () => { activeDay = i; renderAll(); }
    },
      el('span', {class:'nav-btn-icon'}, complete ? '✓' : day.label.slice(0,3)),
      day.name
    );

    if (isActive) {
      btn.style.background = day.color + '22';
      btn.style.borderColor = day.color + '44';
      btn.style.color = day.color;
    } else if (complete) {
      btn.style.color = day.color + '77';
    } else {
      btn.style.color = '#3a3a3a';
    }

    nav.appendChild(btn);
  });
}

// ── Full render ───────────────────────────────────────────────
function renderAll() {
  renderHeader();
  renderCoachPanel();
  renderTabs();
  renderDay();
  renderBottomNav();
}

// ── Export ────────────────────────────────────────────────────
function buildCSV() {
  const rows = [
    `SAKETH GYM TRACKER — Week ${WEEK_META.week} — ${WEEK_META.label}`,
    `Exported: ${new Date().toLocaleString('en-IN')}`,
    `Goal: ${WEEK_META.goal}`,
    ``,
    `Day,Type,Exercise,Set,Weight(kg),Reps,Done,Note`,
  ];
  DAYS.forEach(day => {
    day.sections.forEach(sec => {
      sec.ex.forEach(ex => {
        const exState = STATE[ex.id];
        if (!exState) return;
        exState.sets.forEach((set, si) => {
          const cols = [
            `${day.label} - ${day.name}`, day.focus, ex.name,
            `Set ${si+1}`, set.weight||'', set.reps||'',
            set.checked ? '✓' : '–',
            si === 0 ? (exState.note||'') : ''
          ];
          rows.push(cols.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
        });
      });
    });
  });
  return rows.join('\n');
}

function openExport() {
  const {done, total} = weekStats();
  document.getElementById('modal-sub').textContent = `${done} of ${total} exercises completed`;
  const csv = buildCSV();
  const lines = csv.split('\n');
  document.getElementById('csv-preview').textContent =
    lines.slice(0,22).join('\n') + (lines.length > 22 ? '\n...' : '');
  document.getElementById('dl-btn').style.background = DAYS[activeDay].color;
  document.getElementById('modal-backdrop').style.display = 'flex';
}

function closeExport() {
  document.getElementById('modal-backdrop').style.display = 'none';
}

function handleBackdropClick(e) {
  if (e.target === document.getElementById('modal-backdrop')) closeExport();
}

function copyCSV() {
  const csv = buildCSV();
  const btn = document.getElementById('copy-btn');
  navigator.clipboard.writeText(csv).then(() => {
    btn.textContent = '✓ COPIED!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'COPY CSV'; btn.classList.remove('copied'); }, 2500);
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = csv; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent = '✓ COPIED!';
    setTimeout(() => { btn.textContent = 'COPY CSV'; }, 2500);
  });
}

function downloadCSV() {
  const csv = buildCSV();
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Saketh_W${WEEK_META.week}_${WEEK_META.label.replace(/[^a-z0-9]/gi,'_')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Init ──────────────────────────────────────────────────────
renderAll();
</script>
